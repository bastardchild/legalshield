services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legalshield
      POSTGRES_PASSWORD: legalshield
      POSTGRES_DB: legalshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalshield -d legalshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration + seed runner. Both api and worker wait for this to exit 0.
  # Running `alembic upgrade head` in each service raced on a fresh database: both tried
  # to CREATE TABLE alembic_version and the loser died on a unique violation.
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head && python -m app.seed"
    volumes:
      - ./backend:/app
      - ./seed:/app/seed:ro
    env_file:
      - .env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      # The bind mount shadows the image's own copy of the source, which is what makes
      # --reload work. A production deployment should drop it and use the built image.
      - ./backend:/app
      - ./seed:/app/seed:ro
    ports:
      - "8000:8000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.worker
    volumes:
      - ./backend:/app
      - ./seed:/app/seed:ro
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Test runner. Not started by `docker compose up` (guarded by a profile).
  # Run with:  docker compose run --rm test
  # Config is set inline rather than via .env so tests can never reach a real
  # LLM provider or depend on developer-specific secrets.
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    command: pytest
    volumes:
      - ./backend:/app
      - ./seed:/app/seed:ro
      # The compose files are the subject of tests/test_deployment_config.py, but they live
      # above the build context. Mounted at /deploy rather than under /app: a file mount
      # inside the ./backend:/app mount makes Docker create empty placeholders on the host.
      - ./docker-compose.yml:/deploy/docker-compose.yml:ro
      - ./docker-compose.prod.yml:/deploy/docker-compose.prod.yml:ro
    environment:
      DATABASE_URL: postgresql+asyncpg://legalshield:legalshield@postgres:5432/legalshield
      REDIS_URL: redis://redis:6379/0
      HERMES_BASE_URL: http://llm.invalid
      HERMES_API_KEY: test-key
      LLM_MODEL: test-model
    profiles:
      - test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
