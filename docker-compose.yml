services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legalshield
      POSTGRES_PASSWORD: legalshield
      POSTGRES_DB: legalshield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalshield -d legalshield"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Migrations run here rather than in the app lifespan, so a broken migration fails
    # loudly at boot instead of being papered over by metadata.create_all.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "alembic upgrade head && python -m app.worker"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Test runner. Not started by `docker compose up` (guarded by a profile).
  # Run with:  docker compose run --rm test
  # Config is set inline rather than via .env so tests can never reach a real
  # LLM provider or depend on developer-specific secrets.
  test:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"
    command: pytest
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://legalshield:legalshield@postgres:5432/legalshield
      REDIS_URL: redis://redis:6379/0
      HERMES_BASE_URL: http://llm.invalid
      HERMES_API_KEY: test-key
      LLM_MODEL: test-model
    profiles:
      - test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
