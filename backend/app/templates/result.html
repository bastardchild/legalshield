{% extends "base.html" %}
{% block title %}Analisis — {{ contract.filename }} — LegalShield Agent{% endblock %}

{% block content %}
<div x-data="resultApp('{{ contract_id }}')">

  <!-- Page header -->
  <div class="page-hd">
    <a href="/" class="btn btn-ghost">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
      Upload Baru
    </a>
    <div class="page-hd-text">
      <h1 class="page-title">{{ contract.filename }}</h1>
      <p class="page-sub mono">ID: {{ contract_id }}</p>
    </div>
  </div>

  <!-- WhatsApp banner (sessionStorage, tab-scoped) -->
  <div x-show="waNotify && waPhone" x-cloak class="wa-banner wa-banner-pending">
    <span>💬</span>
    <span>Link hasil akan dikirim ke WhatsApp <span class="mono" x-text="waMasked"></span> saat analisis selesai. Anda boleh menutup halaman.</span>
  </div>

  <!-- Status area (polls every 2s). Polling lives here only; the partials must not
       re-declare hx-trigger or two timers race. -->
  <div id="status-area"
    class="mb-lg"
    hx-get="/partials/{{ contract_id }}/status"
    hx-trigger="load, every 2s"
    hx-swap="innerHTML"
    hx-target="#status-area">
  </div>

  <!-- Result area (polls every 3s) -->
  <div id="result-inner"
    hx-get="/partials/{{ contract_id }}/result"
    hx-trigger="load, every 3s"
    hx-swap="innerHTML"
    hx-target="#result-inner">
  </div>

  <!-- Toast -->
  <div x-show="toast" x-cloak x-transition:enter="fade-up"
    class="toast" :class="toastType==='ok'?'toast-ok':'toast-err'">
    <span x-text="toastType==='ok'?'✅':'❌'"></span>
    <span x-text="toastMsg"></span>
  </div>
</div>
{% endblock %}
